{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Todo List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg app-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand" href="{% url 'list:index' %}"></a>
            <span class="brand-mark">✓</span><span class="brand-name">Todo<span class="brand-accent">List</span></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#appNavbar"
                aria-controls="appNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="appNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'list:index' %}"></a>
                        <i class="bi bi-list-check"></i> Tasks
                    </a>
                </li>
            </ul>

            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'accounts:login' %}">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-signup ms-lg-2" href="{% url 'accounts:signup' %}">
                        Sign up
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="app-main">
    <div class="container">
        <div class="auth-wrap">
            <div class="auth-card">
                <div class="auth-index">01</div>
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Log in to pick up where you left off.</p>

                <form method="post" action="{% url 'accounts:login' %}">
                    {% csrf_token %}
                    <div class="form-field">
                        <label for="username" class="form-label">Username or email</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="yourname">
                    </div>

                    <div class="form-field">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
                    </div>

                    <div class="form-check auth-remember">
                        <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me">
                        <label class="form-check-label" for="remember_me">Remember me</label>
                    </div>

                    <button type="submit" class="btn btn-primary-pine w-100">
                        Log in <i class="bi bi-arrow-right"></i>
                    </button>
                </form>

                <div class="auth-links">
                    <!-- <a href="{% url 'accounts:password_reset' %}">Forgot your password?</a> -->
                    <span class="auth-links-sep">&middot;</span>
                    <a href="{% url 'accounts:signup' %}">Create an account</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="app-footer">
    <div class="container">
        <span>Todo List &mdash; stay on top of what matters.</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
